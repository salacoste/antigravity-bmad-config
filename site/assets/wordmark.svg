<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="antigravity-bmad-config orbital mark">
  <!-- Own-provenance mark for this repo (addendum §H orbital motif):
       concentric orbit arcs and agent nodes around a project core.
       Colors equal the dark theme token values:
       tk color link = #66A3FF, border strong = #FFFFFF3D,
       border default = #FFFFFF24. (No double hyphen runs in this comment:
       XML comments must not contain them, and this file is parsed as
       strict XML when loaded via the img element.) -->
  <circle cx="16" cy="16" r="3.2" fill="#66A3FF"/>
  <ellipse cx="16" cy="16" rx="9" ry="4" fill="none" stroke="#FFFFFF3D" stroke-width="1.2" transform="rotate(-24 16 16)"/>
  <ellipse cx="16" cy="16" rx="13.5" ry="5.6" fill="none" stroke="#FFFFFF24" stroke-width="1.2" transform="rotate(18 16 16)"/>
  <circle cx="23.9" cy="14.6" r="1.8" fill="#66A3FF"/>
  <circle cx="8.1" cy="17.4" r="1.4" fill="#66A3FF"/>
  <circle cx="3.3" cy="13.9" r="1.6" fill="#66A3FF"/>
</svg>
