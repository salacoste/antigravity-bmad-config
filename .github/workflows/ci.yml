name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly: catch a broken/retired pin early

jobs:
  verify-pin:
    name: Pinned bmad-version resolves on npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: make verify-pin

  smoke-test:
    name: Fresh-clone smoke test (setup + layout)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: false # post-step cache save fails on cacheless runners; job doesn't need it
      - run: make smoke-test
